<!doctype html>
<!-- App Store screenshot mock of the iPhone app, drawn from TimePhone/*.swift (Theme, Dial, IdleView,
     LockedView, EmergencyView, OnboardingView, the shield). Render with ./shoot.sh at 440x956 @3x. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: SFR; src: url("file:///System/Library/Fonts/SFNSRounded.ttf"); font-weight: 100 1000; }
@font-face { font-family: SF; src: url("file:///System/Library/Fonts/SFNS.ttf"); font-weight: 100 1000; }
@font-face { font-family: SFM; src: url("file:///System/Library/Fonts/SFNSMono.ttf"); font-weight: 100 1000; }
:root {
  --enamel: rgb(19,38,31); --deep: rgb(7,14,11); --brass: rgb(217,173,92);
  --brassL: rgb(245,219,158); --brassD: rgb(158,117,51); --ink: rgb(15,20,18);
  --soft: rgba(255,255,255,.6); --faint: rgba(255,255,255,.35); --line: rgba(255,255,255,.09);
  --alarm: rgb(235,115,89);
  --fill: linear-gradient(135deg, var(--brassL), var(--brass), var(--brassD));
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 440px; height: 956px; overflow: hidden; position: relative; background: #000; color: #fff;
  font-family: SF; -webkit-font-smoothing: antialiased; }
.screen { position: absolute; inset: 0; overflow: hidden; }
.backdrop { position: absolute; inset: 0;
  background:
    radial-gradient(circle 400px at 10% 100%, rgba(51,115,97,.25), transparent),
    radial-gradient(circle var(--glowR, 380px) at 50% 22%, rgba(217,173,92,var(--glow,.1)), transparent),
    linear-gradient(var(--enamel), var(--deep)); }
.locked .backdrop { --glow: .28; --glowR: 420px; }
.content { position: absolute; top: 62px; left: 0; right: 0; padding: 20px; display: flex; flex-direction: column; gap: 22px; }
.r { font-family: SFR; }
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: 62px; display: flex; align-items: center;
  justify-content: space-between; padding: 6px 34px 0 52px; font: 600 17px SF; z-index: 5; }
.statusbar .icons { display: flex; gap: 7px; align-items: center; }
.home { position: absolute; bottom: 8px; left: 50%; width: 144px; height: 5px; margin-left: -72px;
  border-radius: 3px; background: #fff; z-index: 5; }
.header { display: flex; align-items: center; justify-content: space-between; }
.title { font: 700 34px SFR; letter-spacing: .2px; }
.sub { font-size: 15px; color: var(--soft); margin-top: 2px; }
.round { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.07); }
.round.on { background: var(--fill); box-shadow: 0 0 10px rgba(217,173,92,.5); }
.dialwrap { display: flex; justify-content: center; padding: 4px 0; }
.dial { position: relative; }
.dial > svg { position: absolute; inset: 0; }
.dial .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.label { font: 600 12px SF; letter-spacing: 1.4px; color: var(--faint); text-transform: uppercase; }
.card { border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 14px;
  background: rgba(255,255,255,.065); border: 1px solid var(--line); backdrop-filter: blur(30px); }
.row { display: flex; align-items: center; justify-content: space-between; }
.big { font: 600 17px SFR; margin-top: 4px; }
.pill { font: 600 15px SFR; color: var(--brass); background: rgba(217,173,92,.15); border-radius: 99px; padding: 8px 16px; display: flex; gap: 6px; align-items: center; }
.chips { display: flex; gap: 8px; }
.chip { font: 600 15px SFR; padding: 10px 16px; border-radius: 99px; background: rgba(255,255,255,.07);
  border: 1px solid var(--line); white-space: nowrap; }
.chip.sel { background: var(--fill); color: var(--ink); border-color: transparent; }
.icons6 { display: grid; grid-template-columns: repeat(6, 1fr); row-gap: 12px; column-gap: 10px; justify-items: center; }
.tok { width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.06); display: grid; place-items: center; }
.tok i { width: 31px; height: 31px; border-radius: 8px; display: grid; place-items: center; }
.hold { height: 64px; border-radius: 99px; background: rgba(217,173,92,.14); border: 1px solid rgba(217,173,92,.45);
  display: flex; align-items: center; justify-content: center; gap: 10px; font: 600 17px SFR; color: var(--brassL);
  box-shadow: 0 0 20px rgba(217,173,92,.15); }
.foot { font-size: 13px; color: var(--faint); text-align: center; line-height: 1.35; padding: 0 12px; }
.primary { height: 56px; border-radius: 99px; background: var(--fill); color: var(--ink); font: 600 17px SFR;
  display: grid; place-items: center; box-shadow: 0 6px 16px rgba(217,173,92,.35); }
.link { text-align: center; font-size: 15px; font-weight: 500; color: var(--faint); padding-top: 6px; }
</style></head>
<body>
<div class="statusbar"><span>9:41</span><span class="icons">
  <svg width="19" height="12" viewBox="0 0 19 12" fill="#fff"><rect x="0" y="8" width="3.2" height="4" rx="1"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1"/><rect x="10" y="3" width="3.2" height="9" rx="1"/><rect x="15" y="0" width="3.2" height="12" rx="1"/></svg>
  <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.2-1.2C14 1.6 11.4.5 8.5.5S3 1.6 1 3.6l1.2 1.2C3.9 3.2 6.1 2.3 8.5 2.3zm0 3.4c1.5 0 2.8.5 3.9 1.5l1.2-1.2C12.2 4.7 10.4 4 8.5 4s-3.7.7-5.1 2l1.2 1.2c1.1-1 2.4-1.5 3.9-1.5zm0 3.4c-.6 0-1.1.2-1.5.6L8.5 11.2 10 9.7c-.4-.4-.9-.6-1.5-.6z"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="rgba(255,255,255,.4)"/><rect x="2" y="2" width="17" height="9" rx="2.5" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="rgba(255,255,255,.4)"/></svg>
</span></div>
<div class="home"></div>
<div id="root"></div>

<script>
const $ = s => document.querySelector(s);
const ICON = {
  lock: c => `<svg width="17" height="19" viewBox="0 0 17 19"><rect x="1" y="8" width="15" height="11" rx="3" fill="${c}"/><path d="M4.5 8.5V5.5a4 4 0 0 1 8 0v3" fill="none" stroke="${c}" stroke-width="2.4"/></svg>`,
  open: c => `<svg width="18" height="19" viewBox="0 0 18 19"><rect x="1" y="8" width="13" height="11" rx="3" fill="${c}"/><path d="M10 8.5V5.5a3.8 3.8 0 0 1 7.6 0V7" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  plus: c => `<svg width="13" height="13" viewBox="0 0 13 13"><path d="M6.5 1v11M1 6.5h11" stroke="${c}" stroke-width="2.2" stroke-linecap="round"/></svg>`,
};
// Generic stand-ins for the icons iOS draws for picked apps (Time can't see real ones anyway).
const GLYPH = {
  play: '<path d="M10 7l9 5.5-9 5.5z" fill="#fff"/>',
  bubble: '<path d="M5 8a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-6l-4 3v-3a3 3 0 0 1-2-3z" fill="#fff"/>',
  grid: '<rect x="6" y="6" width="5" height="5" rx="1" fill="#fff"/><rect x="13" y="6" width="5" height="5" rx="1" fill="#fff" opacity=".6"/><rect x="6" y="13" width="5" height="5" rx="1" fill="#fff" opacity=".6"/><rect x="13" y="13" width="5" height="5" rx="1" fill="#fff"/>',
  ring: '<circle cx="12" cy="12" r="6" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="12" cy="12" r="2" fill="#fff"/>',
  star: '<path d="M12 4.5l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L4.8 9.8l5-.7z" fill="#fff"/>',
  wave: '<path d="M4 14c2.5-5 5-5 8 0s5.5 5 8 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>',
  rocket: '<path d="M12 3.5c3 2 4.5 5 4.5 8.5l-1.5 3h-6L7.5 12c0-3.5 1.5-6.5 4.5-8.5z" fill="#fff"/><circle cx="12" cy="10" r="1.6" fill="#555"/><path d="M10 16.5h4l-2 3.5z" fill="#fff" opacity=".7"/>',
};
const TOKENS = [
  ['play', '#e0523f', '#b8322a'], ['bubble', '#4b8df0', '#2a5fc4'], ['grid', '#f2a33a', '#d0701f'],
  ['ring', '#8c5be6', '#5d36b8'], ['star', '#2fb57a', '#1d8655'], ['wave', '#f06aa0', '#c43f74'],
  ['rocket', '#6e7378', '#4a4e52'],
];
const tokens = n => `<div class="icons6">${TOKENS.slice(0, n).map(([g, a, b]) =>
  `<div class="tok"><i style="background:linear-gradient(160deg,${a},${b})"><svg width="24" height="24" viewBox="0 0 24 24">${GLYPH[g]}</svg></i></div>`).join('')}</div>`;

// Dial: same geometry as Components.swift's Dial (120 ticks, major every 10, arc inset 26).
function dial(size, progress, glowing, center) {
  const c = size / 2, r = size / 2;
  let ticks = '';
  for (let i = 0; i < 120; i++) {
    const f = i / 120, a = f * 2 * Math.PI - Math.PI / 2, major = i % 10 === 0;
    const o = r - 2, inn = r - (major ? 16 : 9), lit = f < progress;
    const col = lit ? `rgba(217,173,92,${major ? 1 : .75})` : `rgba(255,255,255,${major ? .28 : .12})`;
    ticks += `<line x1="${c + o * Math.cos(a)}" y1="${c + o * Math.sin(a)}" x2="${c + inn * Math.cos(a)}" y2="${c + inn * Math.sin(a)}" stroke="${col}" stroke-width="${major ? 2.5 : 1.5}" stroke-linecap="round"/>`;
  }
  const ar = r - 26, circ = 2 * Math.PI * ar, len = Math.max(.002, progress) * circ;
  return `<div class="dialwrap"><div class="dial" style="width:${size}px;height:${size}px">
  <svg width="${size}" height="${size}" style="overflow:visible">
    <defs><radialGradient id="face"><stop offset="0" stop-color="rgba(255,255,255,.07)"/><stop offset="1" stop-color="rgba(255,255,255,.01)"/></radialGradient>
    <linearGradient id="bf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--brassL)"/><stop offset=".5" stop-color="var(--brass)"/><stop offset="1" stop-color="var(--brassD)"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${glowing ? 7 : 3}"/></filter></defs>
    <circle cx="${c}" cy="${c}" r="${ar}" fill="url(#face)" stroke="rgba(255,255,255,.09)"/>
    ${ticks}
    ${progress > 0 ? `<g transform="rotate(-90 ${c} ${c})">
      <circle cx="${c}" cy="${c}" r="${ar}" fill="none" stroke="rgba(217,173,92,${glowing ? .7 : .25})" stroke-width="6" stroke-dasharray="${len} ${circ}" stroke-linecap="round" filter="url(#glow)"/>
      <circle cx="${c}" cy="${c}" r="${ar}" fill="none" stroke="url(#bf)" stroke-width="5" stroke-dasharray="${len} ${circ}" stroke-linecap="round"/></g>` : ''}
  </svg><div class="center">${center}</div></div></div>`;
}

const S = {
  // A lock running: 1 day, 14h 23m left.
  locked: () => `<div class="screen locked"><div class="backdrop"></div><div class="content">
    <div class="header"><div><div class="title">Locked</div><div class="sub">Unlocks tomorrow at 7:15 AM</div></div>
      <div class="round on">${ICON.lock('var(--ink)')}</div></div>
    ${dial(300, (14 * 3600 + 23 * 60 + 7) / 86400, true, `
      <div class="label">Time left</div>
      <div class="r" style="font-weight:700;font-size:46px;font-variant-numeric:tabular-nums;margin:6px 0">14:23:07</div>
      <div style="font-size:13px;font-weight:500;color:var(--soft)">of 1d</div>`)}
    <div class="card"><div class="row"><div><div class="label">Locked</div><div class="big">6 apps · 1 category</div></div>
      <div class="pill">${ICON.plus('var(--brass)')}Add</div></div>${tokens(7)}</div>
    <div class="card"><div class="label">Add time</div>
      <div class="chips"><span class="chip">+30m</span><span class="chip">+1h</span><span class="chip">+4h</span><span class="chip">+1d</span></div>
      <div style="font-size:13px;color:var(--faint)">You can always add time. You can't take it away.</div></div>
    <div class="link">Emergency unlock</div>
  </div></div>`,

  // Ready to lock: 1 day picked, 7 items chosen.
  idle: () => `<div class="screen"><div class="backdrop"></div><div class="content">
    <div class="header"><div><div class="title">Time</div><div class="sub">Ready when you are.</div></div>
      <div class="round">${ICON.open('rgba(255,255,255,.6)')}</div></div>
    ${dial(290, 86400 / (7 * 86400), false, `
      <div class="r" style="font-weight:700;font-size:54px">1d</div>
      <div style="font-size:13px;font-weight:500;color:var(--soft);margin-top:4px">ends tomorrow at 9:41 AM</div>`)}
    <div style="margin:0 -20px;overflow:hidden"><div class="chips" style="padding:0 20px;transform:translateX(-128px)">
      ${['15m','30m','1h','2h','4h','8h','1d','3d','7d'].map(l => `<span class="chip ${l === '1d' ? 'sel' : ''}">${l}</span>`).join('')}</div></div>
    <div class="card"><div class="row"><div><div class="label">To lock</div><div class="big">6 apps · 1 category</div></div>
      <div class="pill">Edit</div></div>${tokens(7)}</div>
    <div class="hold">${ICON.lock('var(--brassL)')}Hold to lock for 1d</div>
    <div class="foot">Until the timer ends, locked apps won't open, apps can't be deleted, and the clock stays automatic.</div>
  </div></div>`,

  // What a locked app shows (ShieldExtension.swift).
  shield: () => `<div class="screen" style="background:rgba(13,28,23,.97)">
    <div style="position:absolute;inset:0;background:radial-gradient(circle 360px at 50% 30%, rgba(217,173,92,.08), transparent)"></div>
    <div style="position:absolute;top:300px;left:40px;right:40px;text-align:center">
      <svg width="52" height="60" viewBox="0 0 17 19" style="margin-bottom:26px"><rect x="1" y="8" width="15" height="11" rx="3" fill="rgb(217,173,92)"/><path d="M4.5 8.5V5.5a4 4 0 0 1 8 0v3" fill="none" stroke="rgb(217,173,92)" stroke-width="2.4"/></svg>
      <div style="font:700 26px SF;margin-bottom:12px">Not right now</div>
      <div style="font-size:17px;line-height:1.4;color:rgba(255,255,255,.65)">Locked by Time until tomorrow at 7:15 AM.<br>It'll be here when the timer ends.</div>
    </div>
    <div style="position:absolute;bottom:64px;left:28px;right:28px;height:54px;border-radius:14px;background:var(--brass);color:rgb(13,28,23);display:grid;place-items:center;font:600 17px SF">Close</div>
  </div>`,

  // Emergency unlock, partway through typing (EmergencyView.swift).
  emergency: () => {
    const passage = 'harbor lantern quiet meadow copper ribbon winter falcon gentle studio puzzle orbit velvet canvas thunder pocket island marble season sketch forest napkin humble rocket signal timber walnut prairie mirror engine lemon voyage cabin dancer spiral glacier modest needle tissue salmon border melody kettle tunnel orange wizard frozen legend symbol garden';
    const typed = passage.split(' ').slice(0, 21).join(' ');
    return `<div class="screen locked"><div class="backdrop" style="transform:scale(.93) translateY(-8px);border-radius:40px;filter:brightness(.55)"></div>
    <div style="position:absolute;top:70px;left:0;right:0;bottom:0;background:var(--deep);border-radius:38px 38px 0 0">
      <div style="width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:6px auto 0"></div>
      <div style="position:relative;height:50px;display:flex;align-items:center;justify-content:center;font:600 17px SF">
        <span style="position:absolute;left:20px;font-weight:400;color:var(--brass)">Stay locked</span>Emergency unlock</div>
      <div style="padding:12px 20px;display:flex;flex-direction:column;gap:16px">
        <div class="card"><div class="label">Type this</div>
          <div style="font:400 16px SFM;line-height:1.55;color:rgba(255,255,255,.9)">${passage}</div></div>
        <div style="min-height:170px;padding:16px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line);font:400 16px SFM;line-height:1.4">${typed}<span style="display:inline-block;width:2px;height:19px;background:var(--brass);vertical-align:-3px;margin-left:1px"></span></div>
        <div class="row" style="font:500 13px SF;color:var(--faint);font-variant-numeric:tabular-nums"><span>21/50 words</span><span>at least 38s more</span></div>
        <div class="primary">Submit</div>
      </div>
    </div></div>`;
  },

  // First launch (OnboardingView in TimeApp.swift).
  onboarding: () => {
    const pt = (svg, t) => `<div style="display:flex;gap:14px;align-items:center"><div style="width:34px;height:34px;border-radius:50%;background:rgba(217,173,92,.12);display:grid;place-items:center;flex:none">${svg}</div><div style="font-size:15px;color:rgba(255,255,255,.85);line-height:1.3">${t}</div></div>`;
    const b = 'var(--brass)';
    return `<div class="screen"><div class="backdrop"></div>
    <div style="position:absolute;top:62px;bottom:34px;left:24px;right:24px;display:flex;flex-direction:column;align-items:center;padding:24px 0">
      <div style="flex:1"></div>
      <div style="margin-bottom:40px">${dial(230, .75, true, `<svg width="40" height="46" viewBox="0 0 17 19"><defs><linearGradient id="lf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--brassL)"/><stop offset=".5" stop-color="var(--brass)"/><stop offset="1" stop-color="var(--brassD)"/></linearGradient></defs><rect x="1" y="8" width="15" height="11" rx="3" fill="url(#lf)"/><path d="M4.5 8.5V5.5a4 4 0 0 1 8 0v3" fill="none" stroke="url(#lf)" stroke-width="2.4"/></svg>`)}</div>
      <div class="r" style="font-weight:700;font-size:44px">Time</div>
      <div style="font-size:17px;color:var(--soft);text-align:center;line-height:1.35;margin-top:10px">Lock the apps that eat your day,<br>with a timer you can't talk your way past.</div>
      <div style="flex:1"></div>
      <div style="align-self:stretch;display:flex;flex-direction:column;gap:16px;padding:0 8px 32px">
        ${pt(`<svg width="16" height="16" viewBox="0 0 16 16"><path d="M5 1.5v7M8 1v7M11 2v6.5M3 6v4a5 5 0 0 0 10 0V5" fill="none" stroke="${b}" stroke-width="2" stroke-linecap="round"/></svg>`, 'Locked apps show a shield instead of opening.')}
        ${pt(`<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="9" r="6" fill="none" stroke="${b}" stroke-width="2"/><path d="M8 9V6M6 1h4" stroke="${b}" stroke-width="2" stroke-linecap="round"/></svg>`, "Locks run up to 7 days, and can't be shortened.")}
        ${pt(`<svg width="18" height="13" viewBox="0 0 18 13"><rect x="1" y="1" width="16" height="11" rx="2" fill="none" stroke="${b}" stroke-width="1.8"/><path d="M4 4.5h1M7 4.5h1M10 4.5h1M13 4.5h1M5 8.5h8" stroke="${b}" stroke-width="1.8" stroke-linecap="round"/></svg>`, 'The only way out early is a slow, hand-typed emergency unlock.')}
      </div>
      <div class="primary" style="align-self:stretch">Allow Screen Time access</div>
      <div style="font-size:13px;color:var(--faint);text-align:center;margin-top:14px;line-height:1.35">Your choices stay on this iPhone. Time has no account and sends nothing anywhere.</div>
    </div></div>`;
  },
};
$('#root').innerHTML = S[location.hash.slice(1) || 'locked']();
</script>
</body></html>
